# 后台站点（/etc/nginx/sites-available/wedding-admin）。暂用 8080 端口；买了域名后换成 wedding-admin-https.conf.example。
# 两道门：nginx 访问密码（单独的 .htpasswd-admin）+ 后台凭证（管理员白名单 ADMIN_HOLDERS 的邀请码）。
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=6r/m;

server {
  listen 8080;
  server_name _;  # 换域名时改成 admin.你的域名
  server_tokens off;
  auth_basic "admin";
  auth_basic_user_file /etc/nginx/.htpasswd-admin;
  client_max_body_size 12m;  # 参考图单张 10 MB
  limit_req_status 429;
  root /home/ubuntu/ai-wedding/wedding-agent/admin/dist;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 600s; proxy_send_timeout 600s;

  location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
  location = /api/admin/redeem { limit_req zone=admin_login burst=3 nodelay; proxy_pass http://127.0.0.1:8000; }
  location /api/admin/ { limit_req zone=admin_api burst=60 nodelay; proxy_pass http://127.0.0.1:8000; proxy_buffering off; }
  location /files/ { limit_req zone=admin_api burst=60 nodelay; proxy_pass http://127.0.0.1:8000; }
  location / {
    expires -1;
    try_files $uri /index.html;
    location /assets/ { expires 1y; try_files $uri =404; }
  }
}
