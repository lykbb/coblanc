# 图墙站点（/etc/nginx/sites-available/wedding-gallery）。暂用 8081 端口；买了域名后换成 wedding-gallery-https.conf.example。
# 只给图墙成员（GALLERY_MEMBERS）：nginx 访问密码（单独的 .htpasswd-gallery）+ 图墙凭证（app/portal.py）。只暴露 /api/gallery。
limit_req_zone $binary_remote_addr zone=gallery_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gallery_login:10m rate=6r/m;

server {
  listen 8081;
  server_name _;  # 换域名时改成 gallery.你的域名
  server_tokens off;
  auth_basic "gallery";
  auth_basic_user_file /etc/nginx/.htpasswd-gallery;
  client_max_body_size 12m;  # 参考图单张 10 MB
  limit_req_status 429;
  root /home/ubuntu/ai-wedding/wedding-agent/gallery/dist;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 600s; proxy_send_timeout 600s;

  location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
  location = /api/gallery/redeem { limit_req zone=gallery_login burst=3 nodelay; proxy_pass http://127.0.0.1:8000; }
  location /api/gallery/ { limit_req zone=gallery_api burst=60 nodelay; proxy_pass http://127.0.0.1:8000; proxy_buffering off; proxy_request_buffering on; }
  location / {
    expires -1;
    try_files $uri /index.html;
    location /assets/ { expires 1y; try_files $uri =404; }
  }
}
