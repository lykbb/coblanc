[project]
name = "wedding-agent"
version = "0.1.0"
description = "小囍：上传一张合照，生成婚纱照和婚礼物料"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["app", "tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
